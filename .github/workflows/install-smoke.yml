name: Plugin install smoke

# End-to-end install check (roadmap P6, tier 2): install the real Claude CLI and
# actually install this plugin from its own marketplace. Honest by design:
#   • Only obtaining the CLI is best-effort — if it can't be installed in the
#     runner, the job SKIPS with a clear notice instead of faking success.
#   • Once the CLI IS available, the whole sequence is FAIL-CLOSED: validate →
#     marketplace add → install → `list --json` must all succeed AND the JSON
#     must contain `research-superpowers`. No suppressed errors.
# It is intentionally NOT part of the release gate (release.yml) — tier 2 is
# environment-dependent (CLI availability), so it must never block a release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: Claude CLI validate + install (best-effort)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install Claude CLI (best-effort)
        id: cli
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Validate manifest, install the plugin, verify it is installed
        if: steps.cli.outcome == 'success'
        # Fail-closed: once the CLI is available these must all succeed. Only the
        # CLI install above is best-effort. Isolated CLAUDE_CONFIG_DIR so the run
        # is clean and self-contained.
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-smoke
        run: |
          set -euo pipefail
          claude plugin validate ./
          claude plugin marketplace add ./ --scope user
          claude plugin install research-superpowers@leiverkus-research --scope user
          claude plugin list --json | tee plugins.json
          python3 - <<'PY'
          import json, sys
          plugins = json.load(open("plugins.json"))
          ids = [p.get("id", "") for p in plugins]
          if not any("research-superpowers" in i for i in ids):
              print(f"::error::research-superpowers not installed; got {ids}")
              sys.exit(1)
          print(f"verified installed: {ids}")
          PY

      - name: CLI unavailable — skip honestly
        if: steps.cli.outcome != 'success'
        run: |
          echo "::notice::Claude CLI could not be installed in this runner — plugin install smoke skipped (best-effort, roadmap P6 tier 2)."
