name: Plugin install smoke

# Best-effort end-to-end install check (roadmap P6, tier 2): install the real
# Claude CLI and exercise the plugin's own structural validation plus a local
# marketplace add/install/list. Honest by design:
#   • If the CLI can't be obtained in the runner, the job SKIPS with a clear
#     notice instead of faking success.
#   • If the CLI IS available, `claude plugin validate .` must pass (a real
#     signal); the local marketplace add/install/list are tolerant (they may
#     behave differently across CLI versions).
# It is intentionally NOT part of the release gate (release.yml) — tier 2 is
# best-effort and environment-dependent, so it must never block a release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: Claude CLI validate + install (best-effort)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install Claude CLI (best-effort)
        id: cli
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Validate plugin manifest (must pass when the CLI is available)
        if: steps.cli.outcome == 'success'
        run: claude plugin validate .

      - name: Local marketplace add + install + list (tolerant)
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        run: |
          claude plugin marketplace add . || echo "::warning::marketplace add failed (CLI version diff or needs auth)"
          claude plugin install research-superpowers@leiverkus-research || echo "::warning::install failed (CLI version diff or needs auth)"
          claude plugin list || true

      - name: CLI unavailable — skip honestly
        if: steps.cli.outcome != 'success'
        run: |
          echo "::notice::Claude CLI could not be installed in this runner — plugin install smoke skipped (best-effort, roadmap P6 tier 2)."
