name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call: # reused fail-closed by release.yml before a release is cut

jobs:
  render:
    name: Template publications render (HTML)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.9.38
      - name: Render article, book and presentation to HTML
        working-directory: templates/research-project-template
        run: |
          set -e
          (cd output/article && quarto render article.qmd --to html)
          (cd output/book && quarto render --to html)
          (cd output/presentation && quarto render talk.qmd --to revealjs)
          echo "article, book and presentation all render to HTML"

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Minor pin on the portability matrix: exact patches aren't built for
          # every (os, arch) — 3.12.13 is missing for macOS-arm64 / Windows-x64.
          # The reproducible anchor (the ubuntu `lint` + `release` jobs) keeps the
          # exact 3.12.13 pin; here we just need a current 3.12 per platform.
          python-version: "3.12"
          check-latest: false

      - name: Install pinned dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit + integration tests (incl. hook dispatch on this OS)
        run: python -m unittest discover -s tests -v

  lint:
    name: Schema, lint, and contract checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          check-latest: false

      - name: Install pinned dev dependencies
        # Pinned PyYAML + jsonschema via the Python-bundled pip (no moving pip
        # upgrade) so the toolchain is reproducible. jsonschema powers the P5
        # schema-conformance cross-check; the runtime scripts stay stdlib-only.
        run: python -m pip install -r requirements-dev.txt

      - name: Plugin manifest is valid JSON
        run: |
          python -c "import json; m = json.load(open('.claude-plugin/plugin.json')); print(f\"plugin: {m['name']} v{m['version']}\")"

      - name: Marketplace manifest is valid JSON
        run: |
          python -c "import json; m = json.load(open('.claude-plugin/marketplace.json')); assert m['plugins'], 'no plugins listed'; print(f\"marketplace: {m['name']}, {len(m['plugins'])} plugin(s)\")"

      - name: Plugin and marketplace versions match
        run: |
          plugin_v=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          mp_v=$(python -c "import json; m=json.load(open('.claude-plugin/marketplace.json')); print(m['plugins'][0]['version'])")
          if [ "$plugin_v" != "$mp_v" ]; then
            echo "::error::plugin.json version ($plugin_v) does not match marketplace.json plugin version ($mp_v)"
            exit 1
          fi
          echo "both at v$plugin_v"

      - name: Release metadata is consistent (manifests + CHANGELOG)
        run: |
          v=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          python scripts/release.py check --tag "v$v"

      - name: Frontmatter schema is valid JSON
        run: |
          python -c "import json; json.load(open('schema/knowledge-frontmatter.schema.json'))"
          echo "schema/knowledge-frontmatter.schema.json: valid"

      - name: Schema mirror is in sync
        run: |
          diff -q schema/knowledge-frontmatter.schema.json \
                  templates/research-project-template/schema/knowledge-frontmatter.schema.json
          diff -q schema/knowledge-frontmatter.schema.json \
                  examples/example-project/schema/knowledge-frontmatter.schema.json
          echo "schema mirrors (template + example): in sync"

      - name: Script mirrors are in sync (template == example)
        run: |
          # The scripts ship verbatim in both the template and the example.
          # The canonical source is templates/research-project-template/scripts/;
          # keep the example copy byte-identical (see CONTRIBUTING.md).
          failed=0
          for rel in scripts/lint-wiki.py scripts/wiki-to-graph.py \
                     scripts/graph_mcp.py scripts/wiki-global-graph.py \
                     scripts/library.py scripts/bib-subset.py scripts/bib-search.py \
                     scripts/vendor/cytoscape.min.js; do
            if ! diff -q "templates/research-project-template/$rel" \
                         "examples/example-project/$rel"; then
              echo "::error::$rel differs between template and example (re-sync from the template)"
              failed=1
            fi
          done
          [ $failed -eq 0 ] && echo "all script mirrors in sync"
          exit $failed

      - name: Wiki lint on example project
        run: |
          cd examples/example-project
          python scripts/lint-wiki.py

      - name: Graph build on example project
        run: |
          cd examples/example-project
          python scripts/wiki-to-graph.py --out-dir /tmp/graph
          python <<'PY'
          import json, os
          from xml.etree import ElementTree as ET
          d = json.load(open("/tmp/graph/graph.json"))
          s = d["stats"]
          # Counts track the example-project fixture; update if the example wiki changes.
          assert s["nodes"] == 5, f"expected 5 nodes, got {s['nodes']}"
          assert s["edges"] == 19, f"expected 19 edges, got {s['edges']}"
          assert s["relations_total"] == 6, f"expected 6 relations, got {s['relations_total']}"
          assert d["god_nodes"], "god_nodes is empty"
          assert d["bridges"], "bridges is empty"
          assert d["communities"], "communities is empty"
          assert "community" in d["nodes"][0], "nodes lack a community id"
          ET.parse("/tmp/graph/graph.graphml")  # must be well-formed XML
          html = open("/tmp/graph/graph.html", encoding="utf-8").read()
          assert "cytoscape" in html and "const GRAPH" in html, "graph.html missing lib or data"
          print(f"graph: {s['nodes']} nodes, {s['edges']} edges, "
                f"{len(d['god_nodes'])} god_nodes, {len(d['bridges'])} bridge(s), "
                f"html {len(html)//1024}KB — OK")
          PY

      - name: Graph query on example project
        run: |
          cd examples/example-project
          python <<'PY'
          import json, subprocess
          def q(*a):
              out = subprocess.check_output(["python", "scripts/wiki-to-graph.py", *a, "--json"])
              return json.loads(out)
          assert q("search", "rehov"), "search returned nothing"
          nb = q("neighbors", "tel-rehov")
          assert nb["neighbors"], "neighbors empty"
          p = q("path", "tel-rehov", "chronology-debate")
          assert p["path"], "no path found"
          rel = q("relations", "--type", "contradicts")
          assert len(rel) >= 1, "expected a contradicts relation"
          assert rel[0].get("because"), "expected a `because` rationale on the relation"
          comm = q("communities")
          assert comm and all("members" in c for c in comm), "communities malformed"
          print(f"query OK — neighbours {len(nb['neighbors'])}, "
                f"path {len(p['path'])} hop(s), contradicts {len(rel)}, "
                f"communities {len(comm)}")
          PY

      - name: Graph MCP smoke test on example project
        run: |
          cd examples/example-project
          python <<'PY'
          import json, subprocess
          reqs = [
            {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}},
            {"jsonrpc":"2.0","method":"notifications/initialized"},
            {"jsonrpc":"2.0","id":2,"method":"tools/list"},
            {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"graph_stats","arguments":{}}},
          ]
          inp = "".join(json.dumps(r) + "\n" for r in reqs)
          out = subprocess.run(["python", "scripts/graph_mcp.py"], input=inp,
                               capture_output=True, text=True, timeout=60).stdout
          by_id = {m.get("id"): m for m in (json.loads(l) for l in out.splitlines() if l.strip())}
          assert by_id[1]["result"]["serverInfo"]["name"] == "wiki-graph"
          tools = [t["name"] for t in by_id[2]["result"]["tools"]]
          assert "graph_neighbors" in tools and "graph_stats" in tools, tools
          assert by_id[3]["result"]["isError"] is False
          print(f"MCP OK — {len(tools)} tools, stats call ok")
          PY

      - name: Template build config references real files
        run: |
          cd templates/research-project-template
          test -f output/article/article.qmd
          test -f output/presentation/talk.qmd
          test -f output/book/_quarto.yml
          # No stale German placeholder filenames (artikel/vortrag) in build config
          if grep -rnE 'artikel|vortrag' .gitlab-ci.yml .vscode/tasks.json; then
            echo "::error::stale artikel/vortrag reference in template build config"; exit 1
          fi
          # The wiki is plain Markdown — config must not try to quarto-build knowledge/
          if grep -nE 'quarto (render|preview)' .vscode/tasks.json | grep -qi knowledge; then
            echo "::error::tasks.json still quarto-builds the Markdown wiki"; exit 1
          fi
          # Every quarto target referenced in tasks.json must exist
          python3 <<'PY'
          import re, pathlib
          t = pathlib.Path(".vscode/tasks.json").read_text()
          missing = [q for q in set(re.findall(r'quarto (?:render|preview) (\S+\.qmd)', t))
                     if not list(pathlib.Path("output").rglob(q))]
          assert not missing, f"tasks.json references missing files: {missing}"
          print("template build config OK")
          PY

      - name: Agent ↔ skill contract (scripts/lint-plugin.py)
        # Run the full contract linter, not a reduced shell re-implementation:
        # it checks agent→skill AND skill→agent existence, symmetry, and that
        # agent files carry no procedural checklist (that belongs in SKILL.md).
        # stdlib-only, so no install step needed.
        run: python scripts/lint-plugin.py

      - name: Skill frontmatter is valid YAML
        run: |
          python <<'PY'
          import sys, re, pathlib, yaml
          failed = 0
          for path in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = path.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
              if not m:
                  print(f"::error file={path}::no YAML frontmatter")
                  failed = 1
                  continue
              try:
                  fm = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  print(f"::error file={path}::invalid YAML frontmatter: {e}")
                  failed = 1
                  continue
              if not fm or "name" not in fm or "description" not in fm:
                  print(f"::error file={path}::frontmatter missing 'name' or 'description'")
                  failed = 1
          if not failed:
              print("all skill frontmatter valid")
          sys.exit(failed)
          PY

      - name: Issue templates are valid YAML
        run: |
          for f in .github/ISSUE_TEMPLATE/*.yml; do
            python -c "import yaml; yaml.safe_load(open('$f'))"
            echo "  ✓ $f"
          done

      - name: Self-repo links in .github resolve to real files
        run: |
          python <<'PY'
          import re, sys, pathlib
          failed = 0
          base = "https://github.com/leiverkus/research-superpowers/blob/main/"
          for f in sorted(pathlib.Path(".github").rglob("*")):
              if f.suffix not in (".yml", ".yaml", ".md") or not f.is_file():
                  continue
              for m in re.finditer(re.escape(base) + r"([^ )\"'#]+)", f.read_text(encoding="utf-8")):
                  rel = m.group(1).split("#", 1)[0]
                  if not pathlib.Path(rel).exists():
                      print(f"::error file={f}::dead self-repo link → {rel} (HTTP 404)")
                      failed = 1
          if not failed:
              print("all .github self-repo links resolve")
          sys.exit(failed)
          PY

      - name: Markdown links resolve (docs/ + top-level, file refs only)
        run: |
          python <<'PY'
          import re, sys, pathlib
          failed = 0
          docs = sorted(pathlib.Path("docs").glob("*.md")) + [pathlib.Path("README.md"), pathlib.Path("CHANGELOG.md")]
          for doc in docs:
              text = doc.read_text(encoding="utf-8")
              # Drop inline-code / fenced-code spans so documented link *syntax*
              # (e.g. `[(domain — title)](url)`) is not mistaken for a real link.
              text = re.sub(r"```.*?```", "", text, flags=re.DOTALL)
              text = re.sub(r"`[^`]*`", "", text)
              for match in re.finditer(r"\]\(([^)\s]+)\)", text):
                  target = match.group(1)
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  # Strip anchor fragment
                  path = target.split("#", 1)[0]
                  if not path:
                      continue
                  resolved = (doc.parent / path).resolve()
                  if not resolved.exists():
                      print(f"::error file={doc}::broken link: {target} → {resolved}")
                      failed = 1
          if not failed:
              print("all internal doc links resolve")
          sys.exit(failed)
          PY

      - name: Docs in sync (version badge, skill count, session index)
        run: |
          python <<'PY'
          import json, re, pathlib, sys
          failed = 0
          version = json.load(open(".claude-plugin/plugin.json"))["version"]
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")

          m = re.search(r"badge/version-([0-9][^-]*)-", readme)
          if not m or m.group(1) != version:
              print(f"::error::README version badge ({m and m.group(1)}) != plugin.json ({version})"); failed = 1

          skills = sorted(p.name for p in pathlib.Path("skills").iterdir() if (p / "SKILL.md").exists())
          agents = sorted(p.name for p in pathlib.Path("agents").glob("*.md"))
          # Every counter mention in README + docs/ must equal the real count.
          # Skills were already pinned; subagent counts and the layout-tree file
          # counts previously drifted unchecked (README said "6 subagents",
          # "12 SKILL.md files"), so pin those too.
          checks = [
              (r"(\d+) skills", len(skills), "skills"),
              (r"(\d+) (?:thin-pointer )?subagents", len(agents), "agents"),
              (r"(\d+) agents\b", len(agents), "agents"),
              (r"(\d+) SKILL\.md files", len(skills), "SKILL.md files"),
          ]
          for doc in [pathlib.Path("README.md")] + sorted(pathlib.Path("docs").glob("*.md")):
              text = doc.read_text(encoding="utf-8")
              for pat, real, label in checks:
                  for m in re.finditer(pat, text):
                      if int(m.group(1)) != real:
                          print(f"::error file={doc}::says '{m.group(0)}' but there are {real} {label}"); failed = 1

          session = pathlib.Path("hooks/session-context.md").read_text(encoding="utf-8")
          for s in skills:
              if s not in session:
                  print(f"::error::hooks/session-context.md does not mention skill '{s}'"); failed = 1

          if not failed:
              print(f"docs in sync — v{version}, {len(skills)} skills, session index complete")
          sys.exit(failed)
          PY

      - name: OpenCode embedded index matches session-context
        run: |
          python <<'PY'
          import pathlib, sys
          ts = pathlib.Path("opencode/plugin/research-superpowers.ts").read_text(encoding="utf-8")
          md = pathlib.Path("hooks/session-context.md").read_text(encoding="utf-8").rstrip("\n")
          head = "const EMBEDDED_INDEX = `"
          tail = "`\n\n// ── Helpers"
          try:
              lit = ts[ts.index(head) + len(head):ts.index(tail)]
          except ValueError:
              print("::error file=opencode/plugin/research-superpowers.ts::"
                    "could not locate EMBEDDED_INDEX literal (anchors changed?)")
              sys.exit(1)
          unescaped = lit.replace("\\${", "${").replace("\\`", "`")
          if unescaped != md:
              print("::error file=opencode/plugin/research-superpowers.ts::"
                    "EMBEDDED_INDEX is out of sync with hooks/session-context.md "
                    "(re-run the sync: see opencode/README.md)")
              sys.exit(1)
          print("opencode EMBEDDED_INDEX in sync with session-context.md")
          PY
