# GitLab CI/CD Pipeline
#
# Das Knowledge-Wiki ist reines Markdown (lesbar via Foam/Obsidian oder dem
# GitLab-Repository-Browser) — es wird NICHT in der CI gerendert, sondern nur
# strukturell gelintet. Quarto kommt ausschließlich für die Publikation in
# `output/` zum Einsatz. Bei jedem Push auf `main` (und bei Merge
# Requests) wird das Wiki gelintet und die Publikation gebaut; auf `main` wird
# als GitLab Pages deployt.
#
# PDF-Builds laufen bewusst NICHT in der CI (sie brauchen einen vollen
# LaTeX-Stack); diese lokal über die Makefiles bauen.

stages:
  - lint
  - build
  - deploy

# Lint/Build auf main und bei Merge Requests; Pages nur auf main.
.on_main_or_mr: &on_main_or_mr
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Strukturelle Wiki-Prüfung (Frontmatter, Wikilinks, verwaiste Seiten)
# über knowledge/**/*.md.
lint-wiki:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet pyyaml
    - python scripts/lint-wiki.py
  <<: *on_main_or_mr

# Artikel als HTML bauen (PDF/DOCX lokal über das Makefile).
build-article:
  stage: build
  image: ghcr.io/quarto-dev/quarto:latest
  variables:
    QUARTO_PRINT_STACK: "true"
  script:
    - cd output/article
    - quarto render article.qmd --to html --output-dir _output
  artifacts:
    paths:
      - output/article/_output/
    expire_in: 1 week
  <<: *on_main_or_mr

# Buch als HTML-Website bauen (optional).
build-book:
  stage: build
  image: ghcr.io/quarto-dev/quarto:latest
  variables:
    QUARTO_PRINT_STACK: "true"
  script:
    - cd output/book
    - quarto render --to html
  artifacts:
    paths:
      - output/book/_output/
    expire_in: 1 week
  <<: *on_main_or_mr

# Wissensgraph neu bauen (interaktives graph.html + deterministischer
# GRAPH_REPORT.md). Die Graph-Exporte sind gitignored (Build-Artefakt), daher
# baut die CI sie bei jedem Push frisch und stellt sie unter /graph/ bereit —
# niemand commitet graph.html, das Team liest immer den aktuellen Stand.
build-graph:
  stage: build
  image: python:3.12-slim
  script:
    - pip install --quiet pyyaml
    - python scripts/wiki-to-graph.py --out-dir graph-export
  artifacts:
    paths:
      - graph-export/
    expire_in: 1 week
  <<: *on_main_or_mr

# GitLab Pages deployen: Artikel unter /, Buch unter /book/.
pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build-article
    - build-book
    - build-graph
  script:
    - mkdir -p public
    # Artikel als Hauptseite
    - cp -r output/article/_output/* public/ 2>/dev/null || true
    - mv public/article.html public/index.html 2>/dev/null || true
    # Buch unter /book/
    - mkdir -p public/book
    - cp -r output/book/_output/* public/book/ 2>/dev/null || true
    # Wissensgraph unter /graph/ (graph.html öffnen; GRAPH_REPORT.md daneben)
    - mkdir -p public/graph
    - cp -r graph-export/* public/graph/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
